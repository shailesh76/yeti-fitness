name: Live Verify (manual)

# Runs the FULL test suite, including the live suites that hit the real Supabase
# project (migration.test.ts, rls-live-security.test.ts, the live half of
# auth.test.ts). Manual-only (workflow_dispatch) rather than on every push,
# because these tests create real rows in the live project and can trip
# Supabase's per-email rate limiting if run too frequently — see ci.yml for
# the always-on, side-effect-free default. Use this before a release or
# whenever you want a real end-to-end confidence check.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   EXPO_PUBLIC_SUPABASE_URL
#   EXPO_PUBLIC_SUPABASE_ANON_KEY
#   TEST_ATHLETE1_PASSWORD   -- password for athlete-1@dude.com
#   TEST_ATHLETE2_PASSWORD   -- password for athlete-2@dude.com
#   TEST_COACH_PASSWORD      -- password for coach-a@dude.com
#
# Optional repo secrets (override default test user emails if changed):
#   TEST_ATHLETE1_EMAIL
#   TEST_ATHLETE2_EMAIL
#   TEST_COACH_EMAIL

on:
  workflow_dispatch:

jobs:
  live-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. The root package.json pins
      # packageManager: pnpm@9.0.0, and pnpm/action-setup fails with
      # "Multiple versions of pnpm specified" if both are set.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full test suite (including live)
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          TEST_ATHLETE1_PASSWORD: ${{ secrets.TEST_ATHLETE1_PASSWORD }}
          TEST_ATHLETE2_PASSWORD: ${{ secrets.TEST_ATHLETE2_PASSWORD }}
          TEST_COACH_PASSWORD: ${{ secrets.TEST_COACH_PASSWORD }}
          TEST_ATHLETE1_EMAIL: ${{ secrets.TEST_ATHLETE1_EMAIL }}
          TEST_ATHLETE2_EMAIL: ${{ secrets.TEST_ATHLETE2_EMAIL }}
          TEST_COACH_EMAIL: ${{ secrets.TEST_COACH_EMAIL }}
        run: pnpm test
