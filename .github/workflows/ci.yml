name: CI

on:
  push:
    branches: [main, beta-v1]
  pull_request:
  workflow_dispatch:
    inputs:
      abis:
        description: "Android ABIs for the debug APK (comma-separated)"
        required: false
        default: "arm64-v8a,x86_64"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. The root package.json pins
      # packageManager: pnpm@9.0.0, and pnpm/action-setup fails with
      # "Multiple versions of pnpm specified" if both are set. Reading it
      # from packageManager also keeps CI and local pnpm exactly in sync.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint mobile app
        working-directory: apps/mobile
        run: npx eslint .

      - name: Lint coach-dashboard
        working-directory: apps/coach-dashboard
        run: npx next lint

      - name: Typecheck mobile app
        working-directory: apps/mobile
        run: npx tsc --noEmit

      - name: Typecheck coach-dashboard
        working-directory: apps/coach-dashboard
        run: npx tsc --noEmit

      # No Supabase secrets are configured for this job on purpose. tests/helpers/live.ts
      # only activates its live-Supabase suites (migration, rls-live-security, and the
      # live half of auth) when EXPO_PUBLIC_SUPABASE_URL/ANON_KEY are present, so without
      # them those tests auto-skip and only the fast, deterministic unit tests run.
      # This keeps CI free of rate-limit flakiness and avoids creating real accounts in
      # the live project on every push. See the separate live-verify workflow to run the
      # full suite on demand.
      - name: Run unit tests
        run: pnpm test

      - name: Build mobile app (web export)
        working-directory: apps/mobile
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      # next build prerenders /dashboard/subscription, whose module scope calls
      # createBrowserClient(process.env.NEXT_PUBLIC_SUPABASE_URL!, ...) with no
      # fallback, so @supabase/ssr throws at build time when these are unset:
      #   "@supabase/ssr: Your project's URL and API key are required to create
      #    a Supabase client!"
      # Locally this is supplied by the gitignored apps/coach-dashboard/.env.local.
      - name: Build coach-dashboard
        working-directory: apps/coach-dashboard
        run: npx next build
        # Sourced from the EXPO_PUBLIC_* secrets: same Supabase project, so one
        # pair of secrets serves both apps. Only the env var names differ, since
        # Next.js requires the NEXT_PUBLIC_ prefix to expose them to the client.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

  # Android debug build runs on Linux, where the Windows MAX_PATH limit that
  # blocks local native builds does not exist. pnpm's default isolated layout
  # nests modules under .pnpm/<peer-qualified-name>/node_modules/, pushing
  # AGP's generated prefab_command.bat past the JDK's ~260-char ProcessBuilder
  # limit on Windows. On Linux there is no such limit, so this builds against
  # the unmodified isolated layout — no hoisting, no path workarounds.
  #
  # Kept as a separate job rather than extra steps in build-and-test so the
  # ~20-40 min native build runs in parallel and never delays lint/typecheck/
  # test feedback. `needs` avoids spending runner minutes on broken code.
  android-debug-build:
    needs: build-and-test
    # Not run on every PR: a full native build per PR is expensive. Pushes to
    # the long-lived branches and manual dispatch only.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/beta-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. The root package.json pins
      # packageManager: pnpm@9.0.0, and pnpm/action-setup fails with
      # "Multiple versions of pnpm specified" if both are set. Reading it
      # from packageManager also keeps CI and local pnpm exactly in sync.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # Pinned to the versions the project actually resolves, as reported by
      # the expo-root-project plugin (compileSdk/targetSdk 36, buildTools
      # 36.0.0, ndk 27.1.12297006) plus the CMake that AGP pins (3.22.1).
      # Gradle will auto-provision anything else a module requests.
      - name: Install pinned Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # android/ is generated output and is not committed, so it is created
      # here. GitHub Actions sets CI=true, which makes Expo CLI non-interactive.
      - name: Expo prebuild (Android)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      # Debug builds are signed with the debug.keystore that prebuild generates,
      # so no signing secrets are required. reactNativeArchitectures is passed
      # as an invocation flag; gradle.properties is left untouched.
      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace --info -PreactNativeArchitectures=${{ github.event.inputs.abis || 'arm64-v8a' }}
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      # Diagnostics only. The Gradle failure annotation is just "exit code 1",
      # and this native build cannot be reproduced locally on Windows (MAX_PATH
      # is the reason it runs here), so collect the reports and CMake/CXX logs
      # that explain the failure. Restricted to logs/reports/metadata - no object
      # files or .so output.
      - name: Upload Gradle and CMake diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: |
            apps/mobile/android/**/build/reports/**
            apps/mobile/android/**/.cxx/**/*.log
            apps/mobile/android/**/.cxx/**/*.json
            apps/mobile/android/**/.cxx/**/logs/**
            node_modules/.pnpm/**/android/build/reports/**
            node_modules/.pnpm/**/android/.cxx/**/*.log
            node_modules/.pnpm/**/android/.cxx/**/*.json
            node_modules/.pnpm/**/android/.cxx/**/logs/**
            **/CMakeFiles/CMakeOutput.log
            **/CMakeFiles/CMakeError.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yeti-android-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
